name = "kartcup"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static files: /icon.png /privacy /terms (public/). Worker handles everything else.
[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "kartcup"
database_id = "b08f9d88-298b-41ce-9280-dfa3a4ff4638"

[vars]
APP_DOMAIN = "kartcup.bharadwaj465.workers.dev"          # TODO: your domain (also the MWA identityUri host)
PACKAGE_NAME = "com.fensory.kartcup"      # TODO: must equal the APK package name
CERT_SHA256 = "9E:EA:EE:E5:53:EF:C0:08:32:69:5E:7D:E7:2B:29:75:AA:AA:0B:88:15:EF:93:AB:4A:6C:44:88:C5:48:5C:07"                          # TODO: apksigner --print-certs SHA-256, colon-separated; comma-separate several
SKR_MINT = "SKRbvo6Gf7GondiT3BbTfuRDPqLWei4j2Qy2NPGZhW3"
ORE_MINT = "oreoU2P8bN6jkk3jbaiVxYnG1dCXcYxwhwyK9jSybcp"   # ORE (Regolith Labs); the shop takes it at the market rate. Remove the line to switch ORE off
# TREASURY_OWNER (the wallet entries and purchases are paid to; its SKR associated account is derived) is a secret,
# not a var, so no wallet address sits in this file. Unset, the payout key's own address is used.
PRICES_JSON = "{}"                        # per-sku overrides of catalog.ts, e.g. {"paint.sunset":{"SKR":"1000000"}}
HOUSE_CUT_BPS = "1000"                    # 10% of every prize pool
PAID_ROOMS = "0"                          # "0" = free rooms only (kill switch; no redeploy of the APK needed). Off since 12 Oct 2026:
                                          # the escrow program is not on mainnet yet (escrow/README.md runbook); "1" once it is
# Paid entry is refused from these places (research/20): India's Online Gaming Act 2025 bans paid skill games outright;
# Belgium/Japan/Korea treat paid competitions with chance elements as gambling; the US states mirror Skillz's exclusions.
PAID_BLOCK = "IN,BE,JP,KR,US-AR,US-CT,US-DE,US-LA,US-SD"
PRIORITY_FEE_MICROLAMPORTS = "20000"      # research/22: median on-chain priority fee is 0; this lands simple transfers reliably
APK_URL = "https://github.com/"           # TODO: the GitHub Release / dApp Store link the invite page sends people to
# secrets (wrangler secret put): HELIUS_URL, SESSION_HMAC_KEY, TREASURY_SECRET (payout hot wallet), DEMO_CODE

# Rate limits (Workers Rate Limiting API). RL: per IP per route on the unauthenticated writes (race start/finish,
# events, room create, auth challenge, the RPC proxy). RL_STRICT: per wallet on the demo-code route.
[[ratelimits]]
name = "RL"
namespace_id = "7101"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_STRICT"
namespace_id = "7102"
simple = { limit = 5, period = 60 }

# RL_WIDE: per IP across all room codes on the room read routes (RL there is keyed per IP and room).
[[ratelimits]]
name = "RL_WIDE"
namespace_id = "7103"
simple = { limit = 600, period = 60 }

# Online rooms: one SQLite-backed Durable Object per room code.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
